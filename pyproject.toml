[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-modeling-skills"
version = "1.0.0"
description = "Agent-Native Mathematical Modeling Toolkit for CUMCM / MCM / ICM Competitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mathematical-modeling",
    "cumcm",
    "mcm-icm",
    "agent-skills",
    "optimization",
    "data-analysis",
    "scientific-writing"
]
authors = [
    { name = "CUMCM Modeling Skills Team", email = "contributors@example.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "networkx>=3.0",
    "python-docx>=1.0.0",
    "jsonschema>=4.18.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]
flowchart = [
    "cairosvg>=2.7.0"
]

[project.scripts]
cumcm-flowchart = "skills.06_visualization.cumcm_academic_flowchart.scripts.cumcm_flowchart:main"
cumcm-validate-format = "skills.07_writing.mcm_paper_writing.scripts.cumcm_format_validator:main"
cumcm-check-numbers = "skills.07_writing.mcm_paper_writing.scripts.paper_number_validator:main"
